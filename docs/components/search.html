<dialog id="search-dialog" aria-labelledby="search-title">
  <div class="search-heading">
    <h2 id="search-title">Search documentation</h2>
    <button type="button" data-close-search aria-label="Close search">
      Esc
    </button>
  </div>
  <label for="search-input">Feature, heading, or question</label
  ><input
    id="search-input"
    type="search"
    autocomplete="off"
    placeholder="Try cf-data or timeout"
  />
  <p id="search-status" role="status" aria-live="polite"></p>
  <ul id="search-results"></ul>
</dialog>
<div id="copy-status" class="sr-only" role="status" aria-live="polite"></div>
